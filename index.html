<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat widget demo</title>
<style>
  body { font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 60px 24px; color: #14161c; background: #fbfafc; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 8px; }
  p.lead { color: #6f6a78; margin-top: 0; }
  pre { background: #14161c; color: #eee; padding: 16px; border-radius: 12px; overflow-x: auto; font-size: 13px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Chat widget demo</h1>
  <p class="lead">The launcher sits in the bottom-right. Its dot is green during opening hours and amber outside them.</p>

  <p>
    <button onclick="ChatWidget.open()">Open chat</button>
    <button onclick="ChatWidget.say('A message pushed from the page.')">Push a message</button>
    <button onclick="alert(ChatWidget.isOpenNow() ? 'Open right now' : 'Closed right now')">Check status</button>
  </p>

  <h2>Embed it</h2>
<pre>&lt;script src="chat-widget.js"
        data-title="Nordic Supply Co."
        data-accent="#4b2e5a"
        data-timezone="Europe/Prague"&gt;&lt;/script&gt;</pre>
</main>

<!-- Configure before loading the script -->
<script>
window.ChatWidgetConfig = {
  title: 'Nordic Supply Co.',
  subtitle: 'Replies in a few minutes',
  timezone: 'Europe/Prague',
  hours: {
    mon: [['09:00', '17:30']],
    tue: [['09:00', '17:30']],
    wed: [['09:00', '17:30']],
    thu: [['09:00', '17:30']],
    fri: [['09:00', '15:00']],
    sat: [['10:00', '13:00']],
    sun: []
  },
  // Replace with a real backend call; this just fakes a reply.
  onSend: function (text, api) {
    api.typing(true);
    setTimeout(function () {
      api.reply(api.openNow
        ? 'Thanks, someone is looking at this now.'
        : 'We\u2019re closed, but this is saved and we\u2019ll answer first thing.');
    }, 1000);
  }
};
</script>
<script src="chat-widget.js"></script>
</body>
</html>
